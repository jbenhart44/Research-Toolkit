name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Release gate (command contract, no home paths, credentials or private emails)
        run: python3 tests/check_toolkit.py
      - name: Claims gate (every count and version matches install.sh and VERSION)
        run: python3 tests/check_claims.py
      - name: Model gate (every agent a command starts names the role table's model)
        run: python3 tests/check_models.py
      - name: Gates are proven to fail (mutation checks)
        run: |
          python3 tests/check_toolkit.py --self-test
          python3 tests/check_toolkit_mutations.py
          python3 tests/check_claims.py --self-test
          python3 tests/check_claims_mutations.py
          python3 tests/check_models.py --self-test
          python3 tests/check_models_mutations.py

      - name: Hooks (every hook's self-test and mutation check, and the config reader's)
        run: |
          for t in hooks/*_selftest.py; do python3 "$t"; done
          for m in hooks/*_mutations.py; do python3 "$m"; done

      - name: Scripts (every helper's and check's self-test and mutation check)
        run: |
          for t in scripts/*_selftest.py; do python3 "$t"; done
          python3 scripts/render_chatbot_prompts.py --check
          for s in scripts/usage_counts.py scripts/check_*.py scripts/register_hooks.py scripts/acquire.py scripts/agent_stalls.py scripts/render_chatbot_prompts.py; do
            case "$s" in *_mutations.py) continue ;; esac
            python3 "$s" --self-test
          done
          for m in scripts/*_mutations.py; do python3 "$m"; done

      - name: Skills (every skill runner's self-test and mutation check)
        run: |
          for t in shared/skills/*/assets/*_selftest.py; do python3 "$t"; done
          for m in shared/skills/*/assets/*_mutations.py; do python3 "$m"; done

      - name: Shell scripts parse
        run: for f in install.sh hooks/*.sh scripts/*.sh; do bash -n "$f"; done

      - name: Token-budget hook runs on the system bash (bash 3.2 on macOS) without errors
        run: |
          out=$(echo '{"tool_name":"Agent","tool_input":{"prompt":"hi"}}' | HOME="$RUNNER_TEMP" /bin/bash hooks/token_budget_guard.sh 2>&1 >/dev/null)
          if [ -n "$out" ]; then echo "stderr from token_budget_guard.sh: $out"; exit 1; fi

      - name: Install gate (real installs into temporary HOMEs; every count derived from install.sh)
        run: |
          python3 tests/check_install.py
          python3 tests/check_install.py --self-test
          python3 tests/check_install_mutations.py
